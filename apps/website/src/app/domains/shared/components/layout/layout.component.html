<div class="drawer drawer-end min-h-screen">
  <input
    id="website-chat-drawer"
    type="checkbox"
    class="drawer-toggle"
    autocomplete="off"
    [checked]="chatDrawer.open()"
    (change)="chatDrawer.setOpen($any($event.target).checked)"
  />
  <div class="drawer-content flex flex-col min-h-screen bg-base-100">
    <div
      class="h-1 bg-linear-to-r from-sienna via-sienna-dark to-charcoal"
    ></div>

    <app-header />

    <main class="flex-1 w-full max-w-7xl mx-auto px-5 md:px-8 lg:px-12">
      <router-outlet />
    </main>

    <footer class="bg-secondary text-secondary-content mt-20">
      <div class="max-w-7xl mx-auto px-5 md:px-8 lg:px-12 py-16 w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 w-full text-left">
          <div>
            <h3 class="font-display text-2xl mb-4">NgStore</h3>
            <p class="text-sand/70 font-light leading-relaxed text-sm max-w-xs">
              Curated collections for the discerning eye. We bring together
              exceptional products with refined taste.
            </p>
          </div>

          <div>
            <h4
              class="text-xs uppercase tracking-[0.2em] text-sand/50 mb-5 font-medium"
            >
              Navigate
            </h4>
            <ul class="space-y-3">
              <li>
                <a routerLink="/" class="link link-hover text-sand/70 text-sm"
                  >Home</a
                >
              </li>
              <li>
                <a
                  routerLink="/about"
                  class="link link-hover text-sand/70 text-sm"
                  >About</a
                >
              </li>
              <li>
                <a
                  routerLink="/locations"
                  class="link link-hover text-sand/70 text-sm"
                  >Locations</a
                >
              </li>
            </ul>
          </div>

          <div>
            <h4
              class="text-xs uppercase tracking-[0.2em] text-sand/50 mb-5 font-medium"
            >
              Connect
            </h4>
            <ul class="space-y-3">
              <li>
                <span class="text-sand/70 text-sm">hello&#64;ngstore.com</span>
              </li>
              <li>
                <span class="text-sand/70 text-sm">+1 (555) 000-0000</span>
              </li>
            </ul>
          </div>
        </div>

        <div
          class="border-t border-white/10 mt-12 pt-8 flex flex-col md:flex-row justify-between items-center gap-4"
        >
          <p class="text-sand/40 text-xs">
            &copy; 2026 NgStore. All rights reserved.
          </p>
          <p class="text-sand/40 text-xs font-light italic font-display">
            Crafted with care
          </p>
        </div>
      </div>
    </footer>
  </div>

  <div class="drawer-side z-60">
    <label
      for="website-chat-drawer"
      aria-label="Close chat"
      class="drawer-overlay"
    ></label>
    <app-chat />
  </div>
</div>
