<div
  class="flex items-center justify-between gap-4 p-4 border-b border-base-content/10 shrink-0"
>
  <h2 id="chat-drawer-title" class="font-display text-lg text-charcoal">Chat</h2>
  <button
    type="button"
    class="btn btn-ghost btn-circle btn-sm"
    aria-label="Close chat"
    (click)="close()"
  >
    <svg
      class="w-4 h-4 text-charcoal/60"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>

<div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 min-h-0">
  @for (msg of messages(); track msg.id) {
    <div
      class="chat"
      [class.chat-start]="msg.placement === 'start'"
      [class.chat-end]="msg.placement === 'end'"
    >
      @if (msg.avatarInitials) {
        <div class="chat-image avatar">
          <div
            class="w-10 rounded-full bg-base-300 flex items-center justify-center text-xs font-medium text-charcoal/80"
          >
            {{ msg.avatarInitials }}
          </div>
        </div>
      }
      <div class="chat-header">
        {{ msg.authorName }}
        <time class="text-xs opacity-50">{{ msg.timeLabel }}</time>
      </div>
      <div [class]="chatBubbleClasses(msg)">
        {{ msg.text }}
      </div>
      @if (msg.footer) {
        <div class="chat-footer opacity-50">
          {{ msg.footer }}
        </div>
      }
    </div>
  }
</div>

<div class="p-4 border-t border-base-content/10 shrink-0 bg-base-200">
  <form class="flex flex-col gap-2" (submit)="$event.preventDefault(); send()">
    <textarea
      class="textarea textarea-bordered w-full resize-none text-sm bg-base-100 min-h-18"
      rows="3"
      placeholder="Type a message…"
      [value]="draft()"
      (input)="draft.set($any($event.target).value)"
      (keydown)="onComposerKeydown($event)"
      aria-label="Message"
    ></textarea>
    <button type="submit" class="btn btn-secondary btn-sm uppercase tracking-wider">
      Send
    </button>
  </form>
</div>
