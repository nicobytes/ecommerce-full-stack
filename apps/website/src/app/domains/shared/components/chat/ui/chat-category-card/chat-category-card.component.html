@if (slug(); as slugValue) {
  <a
    [routerLink]="['/category', slugValue]"
    (click)="closeDrawer()"
    class="flex items-center gap-3.5 py-3.5 no-underline text-inherit hover:bg-base-content/5 rounded-lg px-1.5 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
  >
    <div class="avatar shrink-0">
      <div class="w-14 rounded-xl bg-base-200">
        @if (imageUrl()) {
          <img [src]="imageUrl()" [alt]="name()" loading="lazy" />
        }
      </div>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="text-sm font-medium text-base-content truncate">
        {{ name() }}
      </h3>
      <p
        class="text-xs text-base-content/50 mt-1 uppercase tracking-wider"
      >
        Browse
      </p>
    </div>
    <svg
      class="w-4 h-4 shrink-0 text-base-content/40"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m8.25 4.5 7.5 7.5-7.5 7.5"
      />
    </svg>
  </a>
} @else {
  <div class="flex items-center gap-3.5 py-3.5 px-1.5">
    <div class="avatar shrink-0">
      <div class="w-14 rounded-xl bg-base-200">
        @if (imageUrl()) {
          <img [src]="imageUrl()" [alt]="name()" loading="lazy" />
        }
      </div>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="text-sm font-medium text-base-content truncate">
        {{ name() }}
      </h3>
      <p class="text-xs text-base-content/40 mt-1">No link</p>
    </div>
  </div>
}
